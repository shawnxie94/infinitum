name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install sqlite3 CLI (setup-sqlite / db:test:setup 依赖)
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      # package-lock.json 由 npm 11.19.0 生成；Node 22 自带的 npm 10 解析结果不同，
      # 会报 "Missing: magicast@0.3.5 from lock file"。与 Dockerfile 保持同一 npm 版本。
      - name: Pin npm to 11.19.0 (match lockfile generator and Dockerfile)
        run: npm i -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      # tsconfig include 了 .next/types/**/*.ts；App Router 的 RouteContext 等类型
      # 由 next typegen 生成。本地因存在 .next 目录而侥幸通过，CI 必须显式生成。
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
