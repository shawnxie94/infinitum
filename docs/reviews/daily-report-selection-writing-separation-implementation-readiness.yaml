findings:
  - id: DR-IMPL-001
    severity: blocker
    status: resolved
    title: checkpoint failure fields are inverted between success and failure paths
    evidence: src/lib/daily-report/service.ts persists failedStage/failureCode only in failure checkpoints and clears them on terminal success; integration coverage asserts the failure checkpoint shape.
    next_action: none; verified by daily-report task execution and failure checkpoint assertions.
  - id: DR-IMPL-002
    severity: blocker
    status: resolved
    title: manual checkpoint resume does not follow the TRD task-run contract
    evidence: src/lib/tasks/service.ts resumeTaskRun updates the original task run; the retrigger route and task monitor distinguish eligible continue from full regenerate.
    next_action: none; verified by retrigger route and background-task integration assertions.
  - id: DR-IMPL-003
    severity: blocker
    status: resolved
    title: attempt matrix is declarative but not enforced by the runtime
    evidence: src/lib/daily-report/service.ts consumes DAILY_REPORT_ATTEMPT_MATRIX for stage and batch attempts, classifies context overflow, persists stageAttempts, and wraps PERSIST/PUBLISH with an idempotent retry boundary.
    next_action: none; verified by stage attempt handling, context-overflow integration test, and idempotent persist implementation.
  - id: DR-IMPL-004
    severity: blocker
    status: resolved
    title: task timeline is missing required compatibility and execution nodes
    evidence: buildDailyReportTaskTimeline includes the compatibility parent, explicit PLAN_VALIDATE, draft VALIDATE, PERSIST/PUBLISH and batch/validation metrics; integration and component tests assert the mapping.
    next_action: none; verified by timeline integration/component assertions.
  - id: DR-IMPL-005
    severity: warning
    status: resolved
    title: draft and violation checkpoint data are not saved after write/repair
    evidence: src/lib/daily-report/service.ts checkpoints draft and violations after VALIDATE and after REPAIR, including repair count and stage attempts.
    next_action: none; verified by draft/violation checkpoint assertions in daily-report integration coverage.
  - id: DR-IMPL-006
    severity: warning
